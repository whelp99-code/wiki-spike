name: encrypted-lifecycle-conformance

# Gate 8 three-lane evidence join. Downloads and strictly imports the three
# immutable Gate 1 / conformance (pre-canary) / canary (24h) artifact tuples,
# requires a single producer_commit across all three lanes, then builds the
# VERDICT-FREE pre-review manifest and the evidence join that preserves the
# three independent import receipts (scripts/join_gate8_evidence.py).
#
# This workflow is NOT a delivery gate and never emits a pass/fail verdict:
# its output manifest is deliberately verdict-free. Gate 8 delivery requires
# the two independent ARCHITECT/CRITIC attestations and the separate review
# receipt, produced by the review process over the emitted manifest_digest
# (see wiki_spike.infrastructure.conformance). Absence of any required dispatch
# input, any failed strict import, or a producer_commit mismatch is a hard job
# failure -- there is no false-green path.

on:
  workflow_dispatch:
    inputs:
      gate1_run_id:
        description: "Workflow run ID that produced the immutable Gate 1 decision bundle"
        required: true
        type: string
      canary_run_id:
        description: "Workflow run ID that produced the 24-hour canary bundle"
        required: true
        type: string
      conformance_run_id:
        description: "Workflow run ID that produced the pre-canary conformance bundle"
        required: true
        type: string
      workspace_id:
        description: "Encrypted-lifecycle workspace id recorded in the verdict-free manifest"
        required: false
        default: "ws-encrypted-lifecycle"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: encrypted-lifecycle-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate8-evidence-join:
    name: Gate 8 three-lane evidence join (verdict-free, NOT a delivery gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fail closed if any required run id is missing
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${{ inputs.gate1_run_id }}" ]; then echo "::error::gate1_run_id is required"; missing=1; fi
          if [ -z "${{ inputs.canary_run_id }}" ]; then echo "::error::canary_run_id is required"; missing=1; fi
          if [ -z "${{ inputs.conformance_run_id }}" ]; then echo "::error::conformance_run_id is required"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::missing required workflow_dispatch input(s); job fails, never a silent no-op"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Gate 1 decision bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.gate1_run_id }}
          path: gate8-import/gate1
          merge-multiple: true

      - name: Download conformance (pre-canary) bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.conformance_run_id }}
          path: gate8-import/conformance
          merge-multiple: true

      - name: Download canary (24h) bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.canary_run_id }}
          path: gate8-import/canary
          merge-multiple: true

      - name: Verify each tuple imports as a valid acyclic bundle
        run: |
          set -euo pipefail
          for lane in gate1 conformance canary; do
            if [ -d "gate8-import/$lane" ] && ls gate8-import/$lane/*.tar >/dev/null 2>&1; then
              python3 scripts/import_encrypted_lifecycle_bundle.py \
                --input "gate8-import/$lane" \
                --output "gate8-import/$lane-verified"
            else
              echo "::error::no bundle tar found for lane $lane; import verification cannot proceed"
              exit 1
            fi
          done

      - name: Verify digest/commit binding across the three imported lanes
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          lanes = ["gate1", "conformance", "canary"]
          commits = set()
          for lane in lanes:
              envelope_path = next(Path(f"gate8-import/{lane}").glob("bundle-envelope.json"))
              envelope = json.loads(envelope_path.read_text(encoding="utf-8"))
              commits.add(envelope["producer_commit"])
              print(f"{lane}: producer_commit={envelope['producer_commit']} artifact_kind={envelope['artifact_kind']}")

          if len(commits) != 1:
              raise SystemExit(f"::error::producer_commit differs across lanes: {sorted(commits)}")
          print(f"all three lanes bound to producer_commit={commits.pop()}")
          PYEOF

      - name: Build verdict-free pre-review manifest + evidence join
        run: |
          set -euo pipefail
          python3 scripts/join_gate8_evidence.py \
            --gate1 gate8-import/gate1 \
            --conformance gate8-import/conformance \
            --canary gate8-import/canary \
            --workspace-id "${{ inputs.workspace_id }}" \
            --output-dir gate8-join

      - name: Upload Gate 8 join evidence (verdict-free)
        uses: actions/upload-artifact@v4
        with:
          name: gate8-join-evidence
          path: gate8-join/
          retention-days: 90

      - name: Gate 8 join complete (verdict-free; review attestations pending)
        run: |
          echo "Gate 8 three-lane evidence join succeeded."
          echo "Emitted verdict-free pre-review-manifest.json + evidence-join.json (uploaded as gate8-join-evidence)."
          echo "This workflow is NOT a delivery gate and emits no pass/fail verdict."
          echo "Gate 8 delivery requires the two independent ARCHITECT/CRITIC attestations and the"
          echo "separate review receipt, produced by the review process over the emitted manifest_digest"
          echo "(see wiki_spike.infrastructure.conformance)."
