name: encrypted-lifecycle-conformance

on:
  workflow_dispatch:
    inputs:
      implementation_commit:
        description: "Immutable implementation commit to attest"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: encrypted-lifecycle-conformance-${{ inputs.implementation_commit }}
  cancel-in-progress: false

jobs:
  conformance-producer:
    name: CONFORMANCE_PRE_CANARY producer
    runs-on: [self-hosted, macOS, ARM64, wiki-conformance-workstation]
    timeout-minutes: 60
    steps:
      - name: Checkout detached implementation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.implementation_commit }}
          fetch-depth: 0

      - name: Verify dedicated Darwin 25/macOS 26 arm64 workstation and detached HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -r | cut -d. -f1)" = "25"
          test "$(uname -m)" = "arm64"
          case "$(sw_vers -productVersion)" in 26.*) ;; *) echo "::error::CONFORMANCE_PRE_CANARY requires macOS 26"; exit 1 ;; esac
          test "$(git rev-parse --is-inside-work-tree)" = "true"
          test "$(git symbolic-ref -q HEAD || true)" = ""
          test "${{ github.sha }}" = "${{ inputs.implementation_commit }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.implementation_commit }}"

      - name: Bind service-owned Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3.12)"
          test "$( "$python_bin" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' )" = "3.12"
          shim_dir="$RUNNER_TEMP/python312-bin"
          mkdir -p "$shim_dir"
          ln -sf "$python_bin" "$shim_dir/python"
          ln -sf "$python_bin" "$shim_dir/python3"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Install conformance dependencies
        run: python -m pip install ".[dev]"

      - name: Run conformance and build immutable bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          contract_digest="$(find schemas/encrypted-lifecycle -type f -name '*.schema.json' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          toolchain_lock_digest="$(shasum -a 256 pyproject.toml | cut -d' ' -f1)"
          workflow_file_digest="$(shasum -a 256 .github/workflows/encrypted-lifecycle-conformance.yml | cut -d' ' -f1)"
          producer_commit="$(git rev-parse HEAD)"
          produced_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source_run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          test "$producer_commit" = "${{ inputs.implementation_commit }}"
          python3 scripts/run_encrypted_lifecycle_conformance.py \
            --output-dir artifacts/encrypted-lifecycle/conformance \
            --bundle-output-dir artifacts/encrypted-lifecycle/conformance \
            --artifact-metadata-output artifacts/encrypted-lifecycle/conformance/bundle-metadata.json \
            --repository "${{ github.repository }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --platform "self-hosted/macos-26/arm64/wiki-conformance-workstation" \
            --produced-at "$produced_at" \
            --source-run-url "$source_run_url" \
            --contract-digest "$contract_digest" \
            --toolchain-lock-digest "$toolchain_lock_digest" \
            --workflow-file-digest "$workflow_file_digest"
          python3 -c 'import json, os; m = json.load(open("artifacts/encrypted-lifecycle/conformance/bundle-metadata.json")); output = open(os.environ["GITHUB_OUTPUT"], "a"); print("artifact_name=" + m["artifact_name"], file=output); print("tar_path=" + m["tar_path"], file=output)'

      - name: Strictly import local CONFORMANCE_PRE_CANARY bundle
        shell: bash
        run: |
          set -euo pipefail
          metadata="artifacts/encrypted-lifecycle/conformance/bundle-metadata.json"
          tar_path="${{ steps.bundle.outputs.tar_path }}"
          contract_digest="$(find schemas/encrypted-lifecycle -type f -name '*.schema.json' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          toolchain_lock_digest="$(shasum -a 256 pyproject.toml | cut -d' ' -f1)"
          workflow_file_digest="$(shasum -a 256 .github/workflows/encrypted-lifecycle-conformance.yml | cut -d' ' -f1)"
          test -f "$tar_path"
          python3 -c 'import json, sys; from pathlib import Path; sys.path.insert(0, "scripts"); from import_encrypted_lifecycle_bundle import import_bundle, load_archive; m = json.load(open(sys.argv[1])); expected = {"repository": sys.argv[4], "artifact_kind": "CONFORMANCE_PRE_CANARY", "platform": "self-hosted/macos-26/arm64/wiki-conformance-workstation", "producer_commit": sys.argv[5], "contract_digest": sys.argv[6], "toolchain_lock_digest": sys.argv[7], "workflow_file_digest": sys.argv[8], "workflow_run_id": sys.argv[9], "workflow_run_attempt": sys.argv[10], "artifact_name": m["artifact_name"], "bundle_sha256": m["expected"]["bundle_sha256"], "payload_paths": ["payload/conformance-pre-canary.json"], "payload_sha256": m["expected"]["payload_sha256"], "source_run_url": sys.argv[11]}; result = import_bundle(Path(sys.argv[2]), expected=expected); output = Path(sys.argv[3]); output.mkdir(parents=True, exist_ok=True); files = load_archive(Path(sys.argv[2])); [((output / path).parent.mkdir(parents=True, exist_ok=True), (output / path).write_bytes(files[path])) for path in result["payload_paths"]]; (output / "import-receipt.json").write_text(json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")' "$metadata" "$tar_path" artifacts/encrypted-lifecycle/conformance-imported "${{ github.repository }}" "${{ inputs.implementation_commit }}" "$contract_digest" "$toolchain_lock_digest" "$workflow_file_digest" "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload immutable CONFORMANCE_PRE_CANARY bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.tar_path }}
          if-no-files-found: error
          retention-days: 90
