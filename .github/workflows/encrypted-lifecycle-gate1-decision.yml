name: encrypted-lifecycle-gate1-decision

on:
  workflow_dispatch:
    inputs:
      gate1_commit:
        description: "Immutable triggering SHA assessed by both independent feasibility producers"
        required: true
        type: string
      feasibility_run_id:
        required: true
        type: string
      feasibility_run_attempt:
        required: true
        type: string
      feasibility_artifact_name:
        description: "Exact computed SQLCIPHER_FEASIBILITY artifact name"
        required: true
        type: string
      feasibility_bundle_sha256:
        required: true
        type: string
      feasibility_payload_sha256:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: encrypted-lifecycle-gate1-decision-${{ inputs.gate1_commit }}
  cancel-in-progress: false

jobs:
  gate1-decision-producer:
    name: GATE1_DECISION producer
    runs-on: [self-hosted, macOS, ARM64, wiki-gate1-workstation]
    timeout-minutes: 60
    steps:
      - name: Checkout detached implementation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.gate1_commit }}
          fetch-depth: 0

      - name: Verify Darwin 25/macOS 26 arm64 workstation and detached triggering commit
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "${{ inputs.gate1_commit }}"
          test "$(uname -s)" = "Darwin"
          test "$(uname -r | cut -d. -f1)" = "25"
          test "$(uname -m)" = "arm64"
          case "$(sw_vers -productVersion)" in 26.*) ;; *) echo "::error::GATE1_DECISION requires macOS 26"; exit 1 ;; esac
          test "$(git symbolic-ref -q HEAD || true)" = ""
          test "$(git rev-parse HEAD)" = "${{ inputs.gate1_commit }}"

      - name: Bind service-owned Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3.12)"
          test "$( "$python_bin" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' )" = "3.12"
          shim_dir="$RUNNER_TEMP/python312-bin"
          mkdir -p "$shim_dir"
          ln -sf "$python_bin" "$shim_dir/python"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Install Gate 1 decision dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ".[dev]"
          sqlcipher_prefix="$(brew --prefix sqlcipher)"
          test -f "$sqlcipher_prefix/include/sqlcipher/sqlite3.h"
          CPPFLAGS="-I$sqlcipher_prefix/include" LDFLAGS="-L$sqlcipher_prefix/lib" python -m pip install pysqlcipher3
          python -c "from pysqlcipher3 import dbapi2; assert dbapi2.connect(':memory:').execute('PRAGMA cipher_version').fetchone()[0]"

      - name: Download exact SQLCIPHER_FEASIBILITY artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.feasibility_run_id }}
          name: ${{ inputs.feasibility_artifact_name }}
          path: artifacts/encrypted-lifecycle/ubuntu-download

      - name: Strictly import and bind exact Ubuntu tuple
        shell: bash
        run: |
          set -euo pipefail
          contract_digest="$(find schemas/encrypted-lifecycle -type f -name '*.schema.json' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          toolchain_lock_digest="$(shasum -a 256 pyproject.toml | cut -d' ' -f1)"
          workflow_file_digest="$(shasum -a 256 .github/workflows/encrypted-lifecycle-sqlcipher-feasibility.yml | cut -d' ' -f1)"
          tar_path="artifacts/encrypted-lifecycle/ubuntu-download/${{ inputs.feasibility_artifact_name }}.tar"
          test -f "$tar_path"
          test "$(find artifacts/encrypted-lifecycle/ubuntu-download -maxdepth 1 -type f -name '*.tar' -print | wc -l | tr -d ' ')" = "1"
          python3 scripts/import_encrypted_lifecycle_bundle.py --input "$tar_path" --output artifacts/encrypted-lifecycle/ubuntu-import
          python3 scripts/validate_encrypted_lifecycle_gate1_decision.py \
            --receipt artifacts/encrypted-lifecycle/ubuntu-import/import-receipt.json \
            --repository "${{ github.repository }}" \
            --producer-commit "${{ inputs.gate1_commit }}" \
            --contract-digest "$contract_digest" \
            --toolchain-lock-digest "$toolchain_lock_digest" \
            --workflow-file-digest "$workflow_file_digest" \
            --workflow-run-id "${{ inputs.feasibility_run_id }}" \
            --workflow-run-attempt "${{ inputs.feasibility_run_attempt }}" \
            --artifact-name "${{ inputs.feasibility_artifact_name }}" \
            --bundle-sha256 "${{ inputs.feasibility_bundle_sha256 }}" \
            --payload-sha256 "${{ inputs.feasibility_payload_sha256 }}"

      - name: Produce and strictly import independent macOS feasibility evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sqlcipher_feasibility_harness.py --commit "${{ inputs.gate1_commit }}" --output-dir artifacts/encrypted-lifecycle/macos-feasibility-raw
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = next(Path("artifacts/encrypted-lifecycle/macos-feasibility-raw").glob("sqlcipher-feasibility-darwin-arm64.json"))
          def durable(value):
              if isinstance(value, bool) or value is None or isinstance(value, str):
                  return value
              if isinstance(value, (int, float)):
                  return str(value)
              if isinstance(value, list):
                  return [durable(item) for item in value]
              if isinstance(value, dict):
                  return {key: durable(item) for key, item in value.items()}
              raise TypeError(type(value).__name__)
          destination = Path("artifacts/encrypted-lifecycle/macos-feasibility/payload/sqlcipher-feasibility.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(durable(json.loads(source.read_text(encoding="utf-8"))), sort_keys=True, separators=(",", ":")), encoding="utf-8")
          PY
          contract_digest="$(find schemas/encrypted-lifecycle -type f -name '*.schema.json' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          toolchain_lock_digest="$(shasum -a 256 pyproject.toml | cut -d' ' -f1)"
          workflow_file_digest="$(shasum -a 256 .github/workflows/encrypted-lifecycle-gate1-decision.yml | cut -d' ' -f1)"
          python3 scripts/build_encrypted_lifecycle_bundle.py --input artifacts/encrypted-lifecycle/macos-feasibility --output artifacts/encrypted-lifecycle/macos-bundle --payload payload/sqlcipher-feasibility.json --artifact-kind SQLCIPHER_FEASIBILITY --repository "${{ github.repository }}" --producer-commit "${{ inputs.gate1_commit }}" --contract-digest "$contract_digest" --toolchain-lock-digest "$toolchain_lock_digest" --workflow-file-digest "$workflow_file_digest" --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}" --platform "self-hosted/macos-26/arm64/wiki-gate1-workstation"
          macos_tar="$(find artifacts/encrypted-lifecycle/macos-bundle -maxdepth 1 -type f -name '*.tar' -print)"
          test "$(printf '%s\n' "$macos_tar" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          python3 scripts/import_encrypted_lifecycle_bundle.py --input "$macos_tar" --output artifacts/encrypted-lifecycle/macos-import
          receipt=artifacts/encrypted-lifecycle/macos-import/import-receipt.json
          field() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$receipt" "$1"; }
          python3 scripts/validate_encrypted_lifecycle_gate1_decision.py --receipt "$receipt" --repository "${{ github.repository }}" --producer-commit "${{ inputs.gate1_commit }}" --contract-digest "$(field contract_digest)" --toolchain-lock-digest "$(field toolchain_lock_digest)" --workflow-file-digest "$(field workflow_file_digest)" --workflow-run-id "$(field workflow_run_id)" --workflow-run-attempt "$(field workflow_run_attempt)" --artifact-name "$(field artifact_name)" --bundle-sha256 "$(field bundle_sha256)" --payload-sha256 "$(python3 -c 'import json; print(json.load(open("'"$receipt"'"))["payload_sha256"][0])')" --platform "self-hosted/macos-26/arm64/wiki-gate1-workstation"

      - name: Validate independent evidence, vectors, and write Gate 1 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_encrypted_lifecycle_vectors.py
          mkdir -p artifacts/encrypted-lifecycle/gate1-input/payload/macos artifacts/encrypted-lifecycle/gate1-input/payload/ubuntu
          cp artifacts/encrypted-lifecycle/macos-import/payload/sqlcipher-feasibility.json artifacts/encrypted-lifecycle/gate1-input/payload/macos/sqlcipher-feasibility.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          def durable(value):
              if isinstance(value, bool) or value is None or isinstance(value, str):
                  return value
              if isinstance(value, (int, float)):
                  return str(value)
              if isinstance(value, list):
                  return [durable(item) for item in value]
              if isinstance(value, dict):
                  return {key: durable(item) for key, item in value.items()}
              raise TypeError(type(value).__name__)

          for source, destination in (
              ("artifacts/encrypted-lifecycle/ubuntu-import/import-receipt.json", "artifacts/encrypted-lifecycle/gate1-input/payload/ubuntu/import-receipt.json"),
              ("artifacts/encrypted-lifecycle/vector-validation-receipt.json", "artifacts/encrypted-lifecycle/gate1-input/payload/vector-validation.json"),
          ):
              payload = json.loads(Path(source).read_text(encoding="utf-8"))
              Path(destination).write_text(
                  json.dumps(durable(payload), sort_keys=True, separators=(",", ":")),
                  encoding="utf-8",
              )
          PY
          python3 scripts/write_encrypted_lifecycle_gate1_decision.py \
            --feasibility artifacts/encrypted-lifecycle/macos-import/payload/sqlcipher-feasibility.json \
            --feasibility artifacts/encrypted-lifecycle/ubuntu-import/payload/sqlcipher-feasibility.json \
            --expected-producer-commit "${{ inputs.gate1_commit }}" \
            --vector-validation artifacts/encrypted-lifecycle/vector-validation-receipt.json \
            --adr docs/adr/ADR-0026-encrypted-lifecycle-authority-identity.md \
            --adr docs/adr/ADR-0027-encrypted-lifecycle-recovery-deletion.md \
            --schemas-dir schemas/encrypted-lifecycle \
            --fixtures-dir tests/fixtures/encrypted_lifecycle \
            --owner "${{ github.actor }}:EXECUTOR_OWNER" \
            --residual-claim "CI records an executor-owned Gate 1 decision; independent review attestations remain external." \
            --output artifacts/encrypted-lifecycle/gate1-input/payload/gate1-decision.json
          python3 scripts/validate_encrypted_lifecycle_gate1_decision.py \
            --receipt artifacts/encrypted-lifecycle/ubuntu-import/import-receipt.json \
            --repository "${{ github.repository }}" \
            --producer-commit "${{ inputs.gate1_commit }}" \
            --contract-digest "$(find schemas/encrypted-lifecycle -type f -name '*.schema.json' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)" \
            --toolchain-lock-digest "$(shasum -a 256 pyproject.toml | cut -d' ' -f1)" \
            --workflow-file-digest "$(shasum -a 256 .github/workflows/encrypted-lifecycle-sqlcipher-feasibility.yml | cut -d' ' -f1)" \
            --workflow-run-id "${{ inputs.feasibility_run_id }}" \
            --workflow-run-attempt "${{ inputs.feasibility_run_attempt }}" \
            --artifact-name "${{ inputs.feasibility_artifact_name }}" \
            --bundle-sha256 "${{ inputs.feasibility_bundle_sha256 }}" \
            --payload-sha256 "${{ inputs.feasibility_payload_sha256 }}" \
            --macos-feasibility artifacts/encrypted-lifecycle/macos-import/payload/sqlcipher-feasibility.json \
            --ubuntu-feasibility artifacts/encrypted-lifecycle/ubuntu-import/payload/sqlcipher-feasibility.json \
            --vector-validation artifacts/encrypted-lifecycle/vector-validation-receipt.json \
            --decision artifacts/encrypted-lifecycle/gate1-input/payload/gate1-decision.json \
            --adr docs/adr/ADR-0026-encrypted-lifecycle-authority-identity.md \
            --adr docs/adr/ADR-0027-encrypted-lifecycle-recovery-deletion.md \
            --schemas-dir schemas/encrypted-lifecycle \
            --fixtures-dir tests/fixtures/encrypted_lifecycle

      - name: Build immutable GATE1_DECISION bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          contract_digest="$(find schemas/encrypted-lifecycle -type f -name '*.schema.json' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          toolchain_lock_digest="$(shasum -a 256 pyproject.toml | cut -d' ' -f1)"
          workflow_file_digest="$(shasum -a 256 .github/workflows/encrypted-lifecycle-gate1-decision.yml | cut -d' ' -f1)"
          python3 scripts/build_encrypted_lifecycle_bundle.py \
            --input artifacts/encrypted-lifecycle/gate1-input \
            --output artifacts/encrypted-lifecycle/gate1-bundle \
            --payload payload/gate1-decision.json \
            --payload payload/macos/sqlcipher-feasibility.json \
            --payload payload/ubuntu/import-receipt.json \
            --payload payload/vector-validation.json \
            --artifact-kind GATE1_DECISION \
            --repository "${{ github.repository }}" \
            --producer-commit "${{ inputs.gate1_commit }}" \
            --contract-digest "$contract_digest" \
            --toolchain-lock-digest "$toolchain_lock_digest" \
            --workflow-file-digest "$workflow_file_digest" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --platform "self-hosted/macos-26/arm64/wiki-gate1-workstation"
          tar_path="$(find artifacts/encrypted-lifecycle/gate1-bundle -maxdepth 1 -type f -name '*.tar' -print)"
          test "$(printf '%s\n' "$tar_path" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          echo "artifact_name=${tar_path##*/}" | sed 's/\.tar$//' >> "$GITHUB_OUTPUT"

      - name: Strictly import local GATE1_DECISION bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_encrypted_lifecycle_bundle.py \
            --input "artifacts/encrypted-lifecycle/gate1-bundle/${{ steps.bundle.outputs.artifact_name }}.tar" \
            --output artifacts/encrypted-lifecycle/gate1-local-import

      - name: Upload immutable GATE1_DECISION bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: artifacts/encrypted-lifecycle/gate1-bundle/${{ steps.bundle.outputs.artifact_name }}.tar
          if-no-files-found: error
          overwrite: false
          retention-days: 90
