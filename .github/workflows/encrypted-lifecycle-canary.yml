name: encrypted-lifecycle-canary

on:
  workflow_dispatch:
    inputs:
      implementation_commit:
        description: "Immutable implementation commit to attest"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: encrypted-lifecycle-canary-${{ inputs.implementation_commit }}
  cancel-in-progress: false

jobs:
  canary-producer:
    name: CANARY_24H producer
    runs-on: [self-hosted, macOS, ARM64, wiki-canary-workstation]
    timeout-minutes: 1600
    env:
      CANARY_DURABLE_STATE_ROOT: ${{ vars.CANARY_DURABLE_STATE_ROOT }}
    steps:
      - name: Checkout detached implementation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.implementation_commit }}
          fetch-depth: 0
          clean: false

      - name: Verify dedicated Darwin 25/macOS 26 arm64 workstation and detached HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -r | cut -d. -f1)" = "25"
          test "$(uname -m)" = "arm64"
          case "$(sw_vers -productVersion)" in 26.*) ;; *) echo "::error::CANARY_24H requires macOS 26"; exit 1 ;; esac
          test "$(git symbolic-ref -q HEAD || true)" = ""
          test "${{ github.sha }}" = "${{ inputs.implementation_commit }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.implementation_commit }}"

      - name: Bind service-owned Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3.12)"
          test "$( "$python_bin" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' )" = "3.12"
          shim_dir="$RUNNER_TEMP/python312-bin"
          mkdir -p "$shim_dir"
          ln -sf "$python_bin" "$shim_dir/python"
          ln -sf "$python_bin" "$shim_dir/python3"
          echo "$shim_dir" >> "$GITHUB_PATH"
      - name: Verify service-owned durable state root
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANARY_DURABLE_STATE_ROOT"
          case "$CANARY_DURABLE_STATE_ROOT" in /*) ;; *) echo "::error::CANARY_DURABLE_STATE_ROOT must be an absolute service path"; exit 1 ;; esac
          test -d "$CANARY_DURABLE_STATE_ROOT"
          test ! -L "$CANARY_DURABLE_STATE_ROOT"
          test "$(stat -f '%Su:%Lp' "$CANARY_DURABLE_STATE_ROOT")" = "$(id -un):700"
      - name: Simulate durable interruption and automatic recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$CANARY_DURABLE_STATE_ROOT/simulation"
          common=(--duration-seconds 0 --interval-seconds 1 --output-dir /tmp/canary-durable-resume --durable-state-root "$CANARY_DURABLE_STATE_ROOT/simulation" --repository "${{ github.repository }}-durable-resume-simulation-${{ github.run_id }}-${{ github.run_attempt }}" --workflow-run-id "${{ github.run_id }}" --implementation-commit "${{ inputs.implementation_commit }}" --source-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --platform "self-hosted/macos-26/arm64/wiki-canary-workstation" --contract-digest "$(find schemas/encrypted-lifecycle -type f -name '*.schema.json' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)" --toolchain-lock-digest "$(shasum -a 256 pyproject.toml | cut -d' ' -f1)" --workflow-file-digest "$(shasum -a 256 .github/workflows/encrypted-lifecycle-canary.yml | cut -d' ' -f1)")
          if python3 scripts/run_encrypted_lifecycle_canary_24h.py "${common[@]}" --workflow-run-attempt 1 --interrupt-after-probe 0; then
            echo "::error::simulated interruption did not interrupt"; exit 1
          fi
          python3 scripts/run_encrypted_lifecycle_canary_24h.py "${common[@]}" --workflow-run-attempt 2

      - name: Run exact 24-hour canary and build immutable bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          contract_digest="$(find schemas/encrypted-lifecycle -type f -name '*.schema.json' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          toolchain_lock_digest="$(shasum -a 256 pyproject.toml | cut -d' ' -f1)"
          workflow_file_digest="$(shasum -a 256 .github/workflows/encrypted-lifecycle-canary.yml | cut -d' ' -f1)"
          python3 scripts/run_encrypted_lifecycle_canary_24h.py \
            --duration-seconds "86400" \
            --interval-seconds "900" \
            --output-dir artifacts/encrypted-lifecycle/canary \
            --bundle-output-dir artifacts/encrypted-lifecycle/canary \
            --durable-state-root "$CANARY_DURABLE_STATE_ROOT" \
            --repository "${{ github.repository }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --implementation-commit "${{ inputs.implementation_commit }}" \
            --source-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --platform "self-hosted/macos-26/arm64/wiki-canary-workstation" \
            --contract-digest "$contract_digest" \
            --toolchain-lock-digest "$toolchain_lock_digest" \
            --workflow-file-digest "$workflow_file_digest"
          artifact_name="$(python3 -c 'import json; print(json.load(open("artifacts/encrypted-lifecycle/canary/canary-expected-tuple.json"))["artifact_name"])')"
          test -f "artifacts/encrypted-lifecycle/canary/${artifact_name}.tar"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Strictly import local CANARY_24H bundle
        shell: bash
        run: |
          set -euo pipefail
          tar_path="artifacts/encrypted-lifecycle/canary/${{ steps.bundle.outputs.artifact_name }}.tar"
          test -f "$tar_path"
          python3 - "$tar_path" artifacts/encrypted-lifecycle/canary/canary-expected-tuple.json artifacts/encrypted-lifecycle/canary-imported <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from import_encrypted_lifecycle_bundle import import_bundle
          expected = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          result = import_bundle(Path(sys.argv[1]), expected=expected)
          output = Path(sys.argv[3])
          output.mkdir(parents=True, exist_ok=True)
          (output / "import-receipt.json").write_text(json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Upload immutable CANARY_24H bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: artifacts/encrypted-lifecycle/canary/${{ steps.bundle.outputs.artifact_name }}.tar
          if-no-files-found: error
          retention-days: 90
