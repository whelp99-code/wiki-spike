name: encrypted-lifecycle-sqlcipher-feasibility

on:
  workflow_dispatch:
    inputs:
      implementation_commit:
        description: "Immutable commit to assess"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: encrypted-lifecycle-sqlcipher-feasibility-${{ inputs.implementation_commit }}
  cancel-in-progress: false

jobs:
  feasibility-producer:
    name: SQLCIPHER_FEASIBILITY producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout detached implementation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.implementation_commit }}
          fetch-depth: 0

      - name: Verify detached triggering commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref -q HEAD || true)" = ""
          test "${{ github.sha }}" = "${{ inputs.implementation_commit }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.implementation_commit }}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install feasibility-only SQLCipher driver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install sqlcipher3-binary || python -m pip install pysqlcipher3 || true

      - name: Run and canonicalize SQLCipher feasibility harness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sqlcipher_feasibility_harness.py \
            --commit "$(git rev-parse HEAD)" \
            --output-dir artifacts/encrypted-lifecycle/feasibility-raw
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = next(Path("artifacts/encrypted-lifecycle/feasibility-raw").glob("sqlcipher-feasibility-*.json"))
          def durable(value):
              if isinstance(value, bool) or value is None or isinstance(value, str):
                  return value
              if isinstance(value, (int, float)):
                  return str(value)
              if isinstance(value, list):
                  return [durable(item) for item in value]
              if isinstance(value, dict):
                  return {key: durable(item) for key, item in value.items()}
              raise TypeError(type(value).__name__)
          destination = Path("artifacts/encrypted-lifecycle/feasibility/payload/sqlcipher-feasibility.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(durable(json.loads(source.read_text(encoding="utf-8"))), sort_keys=True, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Build immutable SQLCIPHER_FEASIBILITY bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          contract_digest="$(find schemas/encrypted-lifecycle -type f -name '*.schema.json' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          toolchain_lock_digest="$(sha256sum pyproject.toml | cut -d' ' -f1)"
          workflow_file_digest="$(sha256sum .github/workflows/encrypted-lifecycle-sqlcipher-feasibility.yml | cut -d' ' -f1)"
          python3 scripts/build_encrypted_lifecycle_bundle.py \
            --input artifacts/encrypted-lifecycle/feasibility \
            --output artifacts/encrypted-lifecycle/feasibility/bundle \
            --payload payload/sqlcipher-feasibility.json \
            --artifact-kind SQLCIPHER_FEASIBILITY \
            --repository "${{ github.repository }}" \
            --producer-commit "$(git rev-parse HEAD)" \
            --contract-digest "$contract_digest" \
            --toolchain-lock-digest "$toolchain_lock_digest" \
            --workflow-file-digest "$workflow_file_digest" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --platform "github-hosted/ubuntu-24.04/x86_64"
          tar_path="$(find artifacts/encrypted-lifecycle/feasibility/bundle -maxdepth 1 -type f -name '*.tar' -print)"
          test "$(printf '%s\n' "$tar_path" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          echo "artifact_name=${tar_path##*/}" | sed 's/\.tar$//' >> "$GITHUB_OUTPUT"

      - name: Strictly import local SQLCIPHER_FEASIBILITY bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_encrypted_lifecycle_bundle.py \
            --input "artifacts/encrypted-lifecycle/feasibility/bundle/${{ steps.bundle.outputs.artifact_name }}.tar" \
            --output artifacts/encrypted-lifecycle/feasibility/local-import

      - name: Upload immutable SQLCIPHER_FEASIBILITY bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: artifacts/encrypted-lifecycle/feasibility/bundle/${{ steps.bundle.outputs.artifact_name }}.tar
          if-no-files-found: error
          overwrite: false
          retention-days: 90