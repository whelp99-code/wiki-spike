name: phase3-preflight

# This workflow/job name is retained only because GitHub branch protection
# already expects "phase3-preflight / P3-00 preflight". Its current meaning is
# the supported Wiki Memory product gate, not a relabelled Phase 3 checkpoint.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wiki-memory-operational-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: P3-00 preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current product source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lock-pinned project and test tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.17"
          uv export --frozen --extra dev --no-emit-project \
            --format requirements-txt --output-file /tmp/wiki-memory-requirements.txt
          python -m pip install --require-hashes -r /tmp/wiki-memory-requirements.txt
          python -m pip install --no-deps -e .

      - name: Run current Wiki Memory operational gate
        env:
          PYTHONHASHSEED: "0"
          PYTHON_BIN: python
          TZ: UTC
        run: |
          mkdir -p artifacts/operational/${{ github.sha }}
          bash scripts/run_operational_gate.sh 2>&1 \
            | tee artifacts/operational/${{ github.sha }}/gate.log

      - name: Upload current product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-memory-operational-${{ github.sha }}
          path: artifacts/operational/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 30
