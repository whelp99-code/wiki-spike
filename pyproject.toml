[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-spike"
version = "0.1.0"
description = "Local-first encrypted Second Brain with a simple Mac app and read-only AI recall"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "setuptools>=68", "wheel>=0.43", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wiki_spike.resources" = [
    "sqlcipher-feasibility-darwin-arm64.json",
    "trusted-bindings.json",
    "expected-scopes.json",
    "envelope-v1.schema.json",
    "deletion-state-v1.schema.json",
    "state-delta-v1.schema.json",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["error"]

[project.scripts]
wiki = "wiki_spike.cli:main"
wiki-memory = "wiki_spike.operational.desktop:main"
wiki-memory-support = "wiki_spike.operational.cli:main"
wiki-memory-read = "wiki_spike.operational.agent:main"
